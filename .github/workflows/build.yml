name: build flyguy weights
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          curl -sL -o model.pt https://github.com/adventure-gpt/flyguy/raw/main/bot/model.pt
          curl -sL -o graph.npz https://github.com/adventure-gpt/flyguy/raw/main/flyguy/graphs/male_cns_min2_3hop.npz
      - run: python tools/convert_flyguy.py
      - run: |
          git config user.name flyguy && git config user.email flyguy@local
          git add flyguy_weights.lua && git commit -m "build weights" || true
          git push
